#
# Example configuration for running the SHARP Gaussian prediction preprocessor.
# Output location is resolved from GEOFORGE_DATASET_ROOT (preferred) or the
# optional output_root below.
#

scenes:
  - scene-0061            # Optional: limit to specific scenes (omit for all)
cameras:
  - cam_front
  - cam_front_right
  - cam_front_left
  - cam_back
  - cam_back_right
  - cam_back_left

# Leave null to download the default SHARP checkpoint.
checkpoint_path: null

# Override the output directory; if null, GEOFORGE_DATASET_ROOT is used.
output_root: null

# Use "cuda" or "cuda:0" for GPU, "cpu" to force CPU. "default" picks CUDA/MPS/CPU.
device: cuda:0

# Optional: stop after processing this many frames (null to process all).
max_frames: null

# Set true for more verbose SHARP logging.
verbose: false
