#
# Example configuration for the merge-prune Gaussian training demo.
#
# Copy this file and adjust scenes, cameras, and logging preferences as needed.
# Dataset roots are resolved from environment variables and must be set:
# - GEOFORGE_DATASET_ROOT for ROSE outputs
# - NUSCENES_DATAROOT for NuScenes

steps_per_merge_idx: 1000
lr: 0.00001
device: "cuda:0"
log_interval: 10
loss_weights:
  mask:
    sky: 0.0                       # Weight applied to sky mask pixels (0.0 to ignore)
    movable_objects: 0.3           # Weight applied to movable object mask pixels
  frequency_domain:
    weight: 0.3                    # Weight applied to frequency-domain loss
  edge_aware:
    weight: 0.3                    # Weight applied to edge-aware loss
strategy:
  prune_opacity_threshold: 0.03   # Relax pruning so Gaussians survive longer
  grow_grad2d_threshold: 0.01   # Lower growth gate to allow faster point spawning
  refine_start_iter: 250
  refine_stop_iter: 15000
  reset_every: 2000
backface_prune:
  enabled: true
  min_steps: 2000
  depth_threshold: 0.02
  radii_threshold: 1.0
  opacity_threshold: 0.01
scale_anisotropy_weight: 0.5
scale_anisotropy_log_threshold: 0.1
