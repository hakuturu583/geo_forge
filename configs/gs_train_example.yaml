#
# Example configuration for the Gaussian splatting training demo.
#
# Copy this file and adjust scenes, cameras, and logging preferences as needed.
# Dataset roots are resolved from environment variables and must be set:
# - GEOFORGE_DATASET_ROOT for ROSE outputs
# - NUSCENES_DATAROOT for NuScenes

scenes:                          # Optional list of scene directory names under dataset root
  - scene-0061
cameras:                         # Optional list of camera directory names to include
  - cam_front
  - cam_front_right
  - cam_front_left
  - cam_back
  - cam_back_right
  - cam_back_left
steps: 30000
num_gaussians: 100000
lr: 0.005
device: "cuda:0"
wandb_project: geo_forge
wandb_run_name: null              # Optional run name override
log_interval: 10
render_interval: 1000              # Defaults to log_interval if null
loss_weights:
  mask:
    sky: 0.0                       # Weight applied to sky mask pixels (0.0 to ignore)
    movable_objects: 0.1           # Weight applied to movable object mask pixels
  frequency_domain:
    weight: 0.0                    # Weight applied to frequency-domain loss
  edge_aware:
    weight: 0.0                    # Weight applied to edge-aware loss
  hausdorff:
    weight: 0.0                    # Weight applied to Hausdorff loss (geomloss)
    blur: 0.05                     # Hausdorff blur parameter
    max_points: 2048               # Max sampled points per image for Hausdorff loss
    schedule:
      start_scale: 1.0             # Loss scale at the beginning of training
      end_scale: 0.01               # Loss scale at the end of training
      start_step: 0                  # Step to start decaying the loss scale
      end_step: 10000                # If null, uses (steps - 1) from the top-level config
  chamfer:
    weight: 0.3                    # Weight applied to Chamfer loss
    max_points: 8192               # Max sampled points per image for Chamfer loss
    max_distance: 15.0             # Max camera distance (meters) for Chamfer sampling
    schedule:
      start_scale: 1.0             # Loss scale at the beginning of training
      end_scale: 0.01               # Loss scale at the end of training
      start_step: 0                  # Step to start decaying the loss scale
      end_step: 10000                # If null, uses (steps - 1) from the top-level config
strategy:
  prune_opacity_threshold: 0.001   # Relax pruning so Gaussians survive longer
  prune_scale_threshold: 0.5       # Max scale allowed before pruning
  grow_grad2d_threshold: 0.00005   # Lower growth gate to allow faster point spawning
  refine_start_iter: 250
  refine_stop_iter: 15000
  reset_every: 2000
max_render_history: 16
max_eval_sets: 2
