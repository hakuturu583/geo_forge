[project]
name = "geo-forge"
version = "0.1.0"
description = "Gaussian Environment Optimization Forge"
readme = "README.md"
authors = [
    { name = "Masaya Kataoka", email = "ms.kataoka@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.12.0",
    "dataclasses>=0.8",
    "depth-anything-3",
    "imageio>=2.37.2",
    "kernels>=0.11.3",
    "logging>=0.4.9.6",
    "nuscenes-devkit>=1.2.0",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    "pyarrow>=22.0.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "rose",
    "torch>=2.0.0",
    "transformers",
    "wandb>=0.23.1",
    "gsplat>=0.1.0",
    "tqdm>=4.67.1",
    "sharp",
    "splatsim",
    "geomloss>=0.2.6",
]

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
depth-anything-3 = { git = "https://github.com/ByteDance-Seed/Depth-Anything-3.git" }
torch = [
  { index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
transformers = { git = "https://github.com/huggingface/transformers.git", rev = "v5.0.0rc0" }
rose = { git = "https://github.com/hakuturu583/ROSE.git" }
sharp = { git = "https://github.com/hakuturu583/ml-sharp.git" }
splatsim = { git = "https://github.com/hakuturu583/splatsim.git", rev="v0.0.1" }

[project.scripts]
preprocess = "geo_forge.preprocess.preprocess:run_preprocess"
